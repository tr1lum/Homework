<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Bank System</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="welcomeMsg">Welcome, <span id="customerName">User</span></span>
                <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 mb-4">
                <div class="list-group shadow-sm">
                    <button class="list-group-item list-group-item-action active" id="btnBalance" onclick="showSection('balance')">
                        Check Balance
                    </button>
                    <button class="list-group-item list-group-item-action" id="btnTransfer" onclick="showSection('transfer')">
                        Transfer
                    </button>
                    <button class="list-group-item list-group-item-action" id="btnHistory" onclick="showSection('history')">
                        Transaction History
                    </button>
                    <button class="list-group-item list-group-item-action" id="btnCurrency" onclick="showSection('currency')">
                        Currency Converter
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Balance Section -->
                <div id="section-balance" class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Account Balance</h5>
                    </div>
                    <div class="card-body text-center py-5">
                        <h2 class="text-muted">Current Balance</h2>
                        <h1 class="display-4 fw-bold text-primary" id="displayBalance">$0.00</h1>
                        <p class="text-muted">Account: <span id="displayAccount">N/A</span></p>
                        <button class="btn btn-primary btn-lg mt-3" onclick="refreshBalance()">Refresh</button>
                    </div>
                </div>

                <!-- Transfer Section -->
                <div id="section-transfer" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Transfer</h5>
                    </div>
                    <div class="card-body">
                        <form id="transferForm">
                            <div class="mb-3">
                                <label class="form-label">Recipient Account</label>
                                <input type="text" class="form-control" id="transferTo" placeholder="Enter target account number" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Recipient Name</label>
                                <input type="text" class="form-control" id="transferName" placeholder="Enter recipient name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="transferAmount" placeholder="0.00" min="0.01" step="0.01" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Confirm Transfer</button>
                        </form>
                        <div id="transferResult" class="mt-3"></div>
                    </div>
                </div>

                <!-- Transaction History Section -->
                <div id="section-history" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Transaction History</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-5">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="histStart">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" id="histEnd">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-info w-100" onclick="loadHistory()">Search</button>
                            </div>
                        </div>
                        <div id="historyResult">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Amount</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <tr><td colspan="4" class="text-center text-muted">No records found</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Currency Converter Section -->
                <div id="section-currency" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">Currency Converter</h5>
                    </div>
                    <div class="card-body">
                        <form id="currencyForm">
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" class="form-control" id="currencyAmount" placeholder="Enter amount" min="0" step="0.01" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">From</label>
                                    <select class="form-select" id="currencyFrom">
                                        <option value="CNY">CNY - Chinese Yuan</option>
                                        <option value="USD" selected>USD - US Dollar</option>
                                        <option value="EUR">EUR - Euro</option>
                                        <option value="JPY">JPY - Japanese Yen</option>
                                        <option value="GBP">GBP - British Pound</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">To</label>
                                    <select class="form-select" id="currencyTo">
                                        <option value="CNY" selected>CNY - Chinese Yuan</option>
                                        <option value="USD">USD - US Dollar</option>
                                        <option value="EUR">EUR - Euro</option>
                                        <option value="JPY">JPY - Japanese Yen</option>
                                        <option value="GBP">GBP - British Pound</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Convert</button>
                        </form>
                        <div id="currencyResult" class="mt-3 text-center">
                            <h4 id="convertedResult"></h4>
                            <p class="text-muted" id="exchangeRateInfo"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/customer.js"></script>
</body>
</html>

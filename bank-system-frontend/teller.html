<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teller Dashboard - Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Bank System - Teller</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Welcome, <span id="tellerName">Teller</span></span>
                <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 mb-4">
                <div class="list-group shadow-sm">
                    <button class="list-group-item list-group-item-action active" onclick="showSection('createAccount')">
                        Create Account
                    </button>
                    <button class="list-group-item list-group-item-action" onclick="showSection('deposit')">
                        Deposit
                    </button>
                    <button class="list-group-item list-group-item-action" onclick="showSection('withdraw')">
                        Withdraw
                    </button>
                    <button class="list-group-item list-group-item-action" onclick="showSection('closeAccount')">
                        Close Account
                    </button>
                    <button class="list-group-item list-group-item-action" onclick="showSection('customerInfo')">
                        Customer Info
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Create Account -->
                <div id="section-createAccount" class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Create New Account</h5>
                    </div>
                    <div class="card-body">
                        <form id="createAccountForm">
                            <div class="mb-3">
                                <label class="form-label">Customer Name</label>
                                <input type="text" class="form-control" id="caName" placeholder="Enter name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ID Number</label>
                                <input type="text" class="form-control" id="caIdCard" placeholder="Enter 18-digit ID" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="caPhone" placeholder="Enter phone" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Initial Deposit</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="caDeposit" placeholder="0.00" min="0" step="0.01">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Create Account</button>
                        </form>
                        <div id="createAccountResult" class="mt-3"></div>
                    </div>
                </div>

                <!-- Deposit -->
                <div id="section-deposit" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Deposit</h5>
                    </div>
                    <div class="card-body">
                        <form id="depositForm">
                            <div class="mb-3">
                                <label class="form-label">Account Number</label>
                                <input type="text" class="form-control" id="depAccount" placeholder="Enter account number" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Deposit Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="depAmount" placeholder="0.00" min="0.01" step="0.01" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-info w-100">Confirm Deposit</button>
                        </form>
                        <div id="depositResult" class="mt-3"></div>
                    </div>
                </div>

                <!-- Withdraw -->
                <div id="section-withdraw" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">Withdraw</h5>
                    </div>
                    <div class="card-body">
                        <form id="withdrawForm">
                            <div class="mb-3">
                                <label class="form-label">Account Number</label>
                                <input type="text" class="form-control" id="wdAccount" placeholder="Enter account number" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Withdraw Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="wdAmount" placeholder="0.00" min="0.01" step="0.01" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Confirm Withdraw</button>
                        </form>
                        <div id="withdrawResult" class="mt-3"></div>
                    </div>
                </div>

                <!-- Close Account -->
                <div id="section-closeAccount" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Close Account</h5>
                    </div>
                    <div class="card-body">
                        <form id="closeAccountForm">
                            <div class="mb-3">
                                <label class="form-label">Account Number</label>
                                <input type="text" class="form-control" id="clAccount" placeholder="Enter account number to close" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Customer ID Number</label>
                                <input type="text" class="form-control" id="clIdCard" placeholder="Enter customer ID for verification" required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100">Close Account</button>
                        </form>
                        <div id="closeAccountResult" class="mt-3"></div>
                    </div>
                </div>

                <!-- Customer Info -->
                <div id="section-customerInfo" class="card shadow-sm mb-4" style="display:none;">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Customer Information Lookup</h5>
                    </div>
                    <div class="card-body">
                        <form id="customerInfoForm">
                            <div class="mb-3">
                                <label class="form-label">Search by</label>
                                <select class="form-select mb-2" id="searchType">
                                    <option value="account">Account Number</option>
                                    <option value="idCard">ID Number</option>
                                </select>
                                <input type="text" class="form-control" id="searchValue" placeholder="Enter search value" required>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100">Search</button>
                        </form>
                        <div id="customerInfoResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/teller.js"></script>
</body>
</html>
